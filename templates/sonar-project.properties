# SonarCloud project configuration
# Documentação: https://docs.sonarcloud.io/advanced-setup/sonarscanner-for-github-actions/

# Substitua pelos valores reais do projeto no SonarCloud
sonar.projectKey=bankme-tech_NOME-DO-REPO
sonar.organization=bankme-tech

# Diretório do código-fonte (ajuste se necessário)
sonar.sources=src

# Excluir arquivos de teste da análise de cobertura
sonar.exclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx

# Arquivo de cobertura gerado pelo vitest/jest
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Versão (opcional — útil para tracking no SonarCloud)
# sonar.projectVersion=1.0
