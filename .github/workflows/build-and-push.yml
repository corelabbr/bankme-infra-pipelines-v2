name: Build and Push

# Reusable workflow — builds the Docker image and pushes to Artifact Registry.
# Does NOT deploy to Cloud Run.
# Use this for hotfix builds, pre-release validation, or any scenario where
# you want to produce a versioned image without immediately deploying it.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: 'GitHub Environment to use for GCP credentials (develop or staging)'

      dockerfile:
        required: false
        type: string
        default: './Dockerfile'

      working-directory:
        required: false
        type: string
        default: '.'

      ref:
        required: false
        type: string
        description: 'Git ref to checkout. Defaults to triggering ref.'

      image-tag-prefix:
        required: false
        type: string
        description: 'Primary image tag (default: environment name)'

      extra-tags:
        required: false
        type: string
        description: 'Additional image tags, comma-separated'

    secrets:
      GH_PACKAGES_TOKEN:
        required: true

    outputs:
      image-url:
        description: 'Full image URL (tag-based)'
        value: ${{ jobs.build.outputs.image-url }}
      image-url-by-digest:
        description: 'Full image URL pinned by digest'
        value: ${{ jobs.build.outputs.image-url-by-digest }}
      image-digest:
        description: 'Image digest (sha256:…)'
        value: ${{ jobs.build.outputs.image-digest }}

jobs:
  load-config:
    name: Load Config
    runs-on: ubuntu-latest
    outputs:
      service-name:       ${{ steps.config.outputs.service-name }}
      build-node-version: ${{ steps.config.outputs.build-node-version }}
      build-args:         ${{ steps.config.outputs.build-args }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse environments.yml
        id: config
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          python3 << 'PYEOF'
          import yaml, os, sys

          env_key = os.environ['ENVIRONMENT']
          with open('.github/config/environments.yml') as f:
              config = yaml.safe_load(f)

          env_config = config.get('environments', {}).get(env_key)
          if not env_config:
              available = list(config.get('environments', {}).keys())
              print(f"ERROR: environment '{env_key}' not found. Available: {available}")
              sys.exit(1)

          build_cfg = env_config.get('build', {})
          build_args_lines = '\n'.join(f'{k}={v}' for k, v in build_cfg.get('args', {}).items())

          out = os.environ['GITHUB_OUTPUT']
          with open(out, 'a') as f:
              f.write(f"service-name={config.get('service-name', 'service')}\n")
              f.write(f"build-node-version={build_cfg.get('node-version', '20')}\n")
              f.write(f"build-args<<EOF\n{build_args_lines}\nEOF\n")
          PYEOF

  build:
    name: Build & Push
    needs: load-config
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      image-url:           ${{ steps.set-output.outputs.image-url }}
      image-url-by-digest: ${{ steps.set-output.outputs.image-url-by-digest }}
      image-digest:        ${{ steps.build-image.outputs.digest }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Generate image tags
        id: tags
        run: |
          IMAGE_BASE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/${{ needs.load-config.outputs.service-name }}"
          COMMIT_SHORT="${GITHUB_SHA:0:7}"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)

          TAG_PREFIX="${{ inputs.image-tag-prefix }}"
          [ -z "$TAG_PREFIX" ] && TAG_PREFIX="${{ inputs.environment }}"

          TAGS="${IMAGE_BASE}:${TAG_PREFIX}"
          TAGS="${TAGS},${IMAGE_BASE}:${TAG_PREFIX}-${TIMESTAMP}-${COMMIT_SHORT}"
          TAGS="${TAGS},${IMAGE_BASE}:sha-${COMMIT_SHORT}"

          if [ -n "${{ inputs.extra-tags }}" ]; then
            IFS=',' read -ra EXTRA <<< "${{ inputs.extra-tags }}"
            for tag in "${EXTRA[@]}"; do
              TAGS="${TAGS},${IMAGE_BASE}:${tag}"
            done
          fi

          echo "tags=${TAGS}"             >> $GITHUB_OUTPUT
          echo "image-base=${IMAGE_BASE}" >> $GITHUB_OUTPUT
          echo "primary-tag=${TAG_PREFIX}" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare build-args
        id: build-env
        run: |
          BUILD_ARGS="GH_PACKAGES_TOKEN=${{ secrets.GH_PACKAGES_TOKEN }}"
          BUILD_ARGS="${BUILD_ARGS}"$'\ngithub_token=${{ secrets.GH_PACKAGES_TOKEN }}'
          EXTRA="${{ needs.load-config.outputs.build-args }}"
          [ -n "$EXTRA" ] && BUILD_ARGS="${BUILD_ARGS}"$'\n'"${EXTRA}"

          echo "args<<EOF"   >> $GITHUB_OUTPUT
          echo "$BUILD_ARGS" >> $GITHUB_OUTPUT
          echo "EOF"         >> $GITHUB_OUTPUT

      - name: Build and push image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.working-directory }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ steps.build-env.outputs.args }}
          cache-from: type=gha
          cache-to: type=gha,mode=min,ignore-error=true

      - name: Set outputs
        id: set-output
        run: |
          echo "image-url=${{ steps.tags.outputs.image-base }}:${{ steps.tags.outputs.primary-tag }}" >> $GITHUB_OUTPUT
          echo "image-url-by-digest=${{ steps.tags.outputs.image-base }}@${{ steps.build-image.outputs.digest }}" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## Build Complete — Ready to Promote" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ steps.tags.outputs.image-base }}:${{ steps.tags.outputs.primary-tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Digest** | \`${{ steps.build-image.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Para promover para produção, acesse **Actions → Deploy to Production** e informe:" >> $GITHUB_STEP_SUMMARY
          echo "\`version: ${{ steps.tags.outputs.primary-tag }}\`" >> $GITHUB_STEP_SUMMARY
